<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuan Pogi System</title>
<style>
:root{
  --bg:#f3f5f2; --surface:#ffffff; --text:#1d2a24; --muted:#5f6f67;
  --line:#d5ddd8; --accent:#1f6f54; --accent-text:#ffffff;
  --danger:#b3261e; --warn-bg:#fdebd0; --warn-text:#7a4a00; --sel:#e1f0e9;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121815; --surface:#1b2420; --text:#e6efe9; --muted:#9db0a6;
    --line:#2e3b35; --accent:#4cc39b; --accent-text:#0b1a14;
    --danger:#ff8a80; --warn-bg:#4a3510; --warn-text:#ffd58a; --sel:#23382f;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;padding:16px}
main{max-width:1050px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat span{display:block;color:var(--muted);font-size:.85rem}
.stat b{font-size:1.5rem}
.layout{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.panel h2{font-size:1rem;margin:0 0 10px}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 3px}
input{width:100%;padding:8px 10px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
button{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.danger{color:var(--danger)}
#msg{min-height:1.3em;margin-top:10px;font-size:.85rem;color:var(--danger)}
#setup{display:none;background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.85rem}
td.num,th.num{text-align:right}
tbody tr{cursor:pointer}
tbody tr.sel{background:var(--sel)}
.low{background:var(--warn-bg);color:var(--warn-text);border-radius:4px;padding:1px 6px;font-weight:600}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:1.1rem;margin-bottom:4px}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Yuan Pogi System</h1>
  <div id="setup">Database not connected yet. Open <b>index.html</b> and paste your Supabase URL and key at the top of the script.</div>

  <section class="stats" aria-label="Summary">
    <div class="stat"><span>Total Items</span><b id="sItems">0</b></div>
    <div class="stat"><span>Total Quantity</span><b id="sQty">0</b></div>
    <div class="stat"><span>Total Value (PHP)</span><b id="sValue">0.00</b></div>
    <div class="stat"><span>Low Stock (&le; 5)</span><b id="sLow">0</b></div>
  </section>

  <div class="layout">
    <section class="panel">
      <h2>Item Details</h2>
      <label for="name">Name</label><input id="name" autocomplete="off">
      <label for="category">Category</label><input id="category" autocomplete="off">
      <label for="quantity">Quantity</label><input id="quantity" type="number" min="0" step="1" inputmode="numeric">
      <label for="price">Price</label><input id="price" type="number" min="0" step="0.01" inputmode="decimal">
      <div class="btns">
        <button class="primary" id="addBtn">Add</button>
        <button id="updateBtn">Update</button>
        <button class="danger" id="deleteBtn">Delete</button>
        <button id="clearBtn">Clear</button>
      </div>
      <div id="msg" role="alert"></div>
    </section>

    <section class="panel tablewrap">
      <table id="tbl">
        <thead><tr><th>ID</th><th>Name</th><th>Category</th><th class="num">Quantity</th><th class="num">Price</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden><b>No items yet</b>Add an item using the form to get started.</div>
    </section>
  </div>
</main>

<script>
var SUPABASE_URL = "https://oouajznhpodhvvlnfhxu.supabase.co";
var SUPABASE_KEY = "sb_publishable_UeXsp1-z6yyfA6XiyDw-qg_22qbYGun";

(function(){
  var LOW = 5;
  var items = [], selectedId = -1, busy = false;
  var $ = function(id){ return document.getElementById(id); };
  var f = { name:$("name"), category:$("category"), quantity:$("quantity"), price:$("price") };
  var configured = SUPABASE_URL.indexOf("http") === 0 && SUPABASE_KEY.indexOf("PASTE") !== 0;

  function say(t){ $("msg").textContent = t || ""; }
  function money(n, grouped){
    return Number(n).toLocaleString("en-PH", {minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:!!grouped});
  }

  // ---- Cloud database calls (replaces ItemDAO.java) ----
  function api(query, method, body){
    var headers = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };
    if (SUPABASE_KEY.indexOf("eyJ") === 0) headers["Authorization"] = "Bearer " + SUPABASE_KEY; // old-style anon key only
    return fetch(SUPABASE_URL + "/rest/v1/items" + query, {
      method: method || "GET",
      headers: headers,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){ throw new Error(t || res.statusText); });
      return res.status === 204 ? null : res.text().then(function(t){ return t ? JSON.parse(t) : null; });
    });
  }
  var dao = {
    getAll: function(){ return api("?select=*&order=id.asc"); },
    add:    function(d){ return api("", "POST", d); },
    update: function(id, d){ return api("?id=eq." + id, "PATCH", d); },
    remove: function(id){ return api("?id=eq." + id, "DELETE"); }
  };

  function setBusy(b){
    busy = b;
    ["addBtn","updateBtn","deleteBtn","clearBtn"].forEach(function(id){ $(id).disabled = b; });
  }
  function run(promiseFn, errText, after){
    if (!configured) { say("Connect your Supabase database first (see setup note above)."); return; }
    if (busy) return;
    setBusy(true); say("");
    promiseFn().then(function(){ return reload(); }).then(function(){ if (after) after(); })
      .catch(function(e){ say(errText + " " + e.message); })
      .then(function(){ setBusy(false); });
  }
  function reload(){
    return dao.getAll().then(function(rows){
      items = rows.map(function(r){
        return { id:r.id, name:r.name, category:r.category, quantity:Number(r.quantity), price:Number(r.price) };
      });
      render();
    });
  }

  function render(){
    var tbody = $("rows"); tbody.innerHTML = "";
    var qty = 0, value = 0, low = 0;
    items.forEach(function(it){
      qty += it.quantity; value += it.quantity * it.price;
      if (it.quantity <= LOW) low++;
      var tr = document.createElement("tr");
      if (it.id === selectedId) tr.className = "sel";
      [it.id, it.name, it.category, it.quantity, money(it.price)].forEach(function(v, i){
        var td = document.createElement("td");
        if (i >= 3) td.className = "num";
        if (i === 3 && it.quantity <= LOW) {
          var s = document.createElement("span"); s.className = "low"; s.textContent = v; td.appendChild(s);
        } else td.textContent = v;
        tr.appendChild(td);
      });
      tr.addEventListener("click", function(){ select(it.id); });
      tbody.appendChild(tr);
    });
    $("sItems").textContent = items.length;
    $("sQty").textContent = qty;
    $("sValue").textContent = money(value, true);
    $("sLow").textContent = low;
    $("tbl").hidden = items.length === 0;
    $("empty").hidden = items.length !== 0;
  }

  function select(id){
    var it = items.find(function(x){ return x.id === id; });
    if (!it) return;
    selectedId = id;
    f.name.value = it.name; f.category.value = it.category;
    f.quantity.value = it.quantity; f.price.value = it.price;
    say(""); render();
  }
  function clearForm(){
    selectedId = -1;
    Object.keys(f).forEach(function(k){ f[k].value = ""; });
    say(""); render();
  }
  function readForm(){
    var name = f.name.value.trim(), category = f.category.value.trim();
    if (!name || !category) { say("Name and Category are required."); return null; }
    var q = f.quantity.value.trim(), p = f.price.value.trim();
    if (!/^\d+$/.test(q) || p === "" || isNaN(Number(p))) {
      say("Quantity must be a whole number and Price must be a number."); return null;
    }
    if (Number(p) < 0) { say("Price cannot be negative."); return null; }
    return { name:name, category:category, quantity:parseInt(q,10), price:Number(p) };
  }

  $("addBtn").addEventListener("click", function(){
    var d = readForm(); if (!d) return;
    run(function(){ return dao.add(d); }, "Could not add item:", clearForm);
  });
  $("updateBtn").addEventListener("click", function(){
    if (selectedId === -1) { say("Select an item from the table first."); return; }
    var d = readForm(); if (!d) return;
    var id = selectedId;
    run(function(){ return dao.update(id, d); }, "Could not update item:", clearForm);
  });
  $("deleteBtn").addEventListener("click", function(){
    if (selectedId === -1) { say("Select an item from the table first."); return; }
    if (!confirm("Delete this item?")) return;
    var id = selectedId;
    run(function(){ return dao.remove(id); }, "Could not delete item:", clearForm);
  });
  $("clearBtn").addEventListener("click", clearForm);

  if (!configured) { $("setup").style.display = "block"; render(); }
  else { reload().catch(function(e){ say("Could not load data: " + e.message); }); }
})();
</script>
</body>
</html>
